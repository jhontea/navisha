name: Deploy to VPS

# Runs on merge to main (a merged PR pushes a commit to main).
# Also allows a manual run from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never run two deploys at once; cancel an in-progress one if a newer
  # commit lands on main.
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_R2_PUBLIC_URL: https://assets.navisha.cloud

jobs:
  # Same checks that run on pull requests (see ci.yml).
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push-images:
    name: Build and Push Docker Images
    needs: [ci]
    runs-on: ubuntu-latest
    # Only this job pushes to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/jhontea/navisha-backend:${{ github.sha }}
            ghcr.io/jhontea/navisha-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/jhontea/navisha-frontend:${{ github.sha }}
            ghcr.io/jhontea/navisha-frontend:latest
          # The Google settings are read from repository secrets first (where they
          # are kept), then variables. The other NEXT_PUBLIC_* stay on variables
          # only: older secrets with those names were never used and are not
          # switched on here.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.navisha.cloud/api/v1' }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || '' }}
            NEXT_PUBLIC_LOCATION_PROVIDER=${{ secrets.NEXT_PUBLIC_LOCATION_PROVIDER || vars.NEXT_PUBLIC_LOCATION_PROVIDER || 'geoapify' }}
            NEXT_PUBLIC_MAP_PROVIDER=${{ secrets.NEXT_PUBLIC_MAP_PROVIDER || vars.NEXT_PUBLIC_MAP_PROVIDER || 'maplibre' }}
            NEXT_PUBLIC_LOCATION_PHOTOS_ENABLED=${{ vars.NEXT_PUBLIC_LOCATION_PHOTOS_ENABLED || 'false' }}
            NEXT_PUBLIC_MAP_TILE_URL=${{ vars.NEXT_PUBLIC_MAP_TILE_URL || '/api/map-tiles/{z}/{x}/{y}' }}
            NEXT_PUBLIC_MAP_ATTRIBUTION=${{ vars.NEXT_PUBLIC_MAP_ATTRIBUTION || 'OpenStreetMap contributors CARTO' }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ env.NEXT_PUBLIC_R2_PUBLIC_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy
    needs: [build-and-push-images]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Server path of the checkout, kept in a secret rather than the repo.
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          # Deploy the images built for this commit, not whatever :latest is.
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: APP_DIR,IMAGE_TAG
          command_timeout: 30m
          # Stop on first error, fail on unset vars, fail piped commands.
          script_stop: true
          script: |
            set -euo pipefail
            : "${APP_DIR:?VPS_APP_DIR secret is not set}"
            cd "$APP_DIR"

            echo "==> Pulling latest code"
            git fetch --prune origin main
            git reset --hard origin/main

            echo "==> Logging in to GitHub Container Registry"
            if [ ! -f .env.deploy ]; then
              echo "Missing .env.deploy in the app directory"
              exit 1
            fi
            set -a
            source ./.env.deploy
            set +a
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling pre-built images ($IMAGE_TAG)"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Restarting containers without building"
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Deployed containers:"
            docker compose -f docker-compose.prod.yml ps
