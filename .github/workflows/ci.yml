name: CI

# Runs on every pull request, and is called by deploy.yml before images
# are built, so the checks live in one place.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its previous CI run. Runs called from
  # deploy.yml (push to main) are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_R2_PUBLIC_URL: https://assets.navisha.cloud

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Lint gates PRs only: it reports issues new relative to the PR base,
      # and code on main has already passed this step in its PR. On failure
      # each output line becomes an annotation, readable without log access.
      - name: Lint (new issues only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=200 origin "$BASE_REF"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          set +e
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev="origin/$BASE_REF" ./... > lint.txt 2>&1
          code=$?
          set -e
          cat lint.txt
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do echo "::error title=golangci-lint::$line"; done < lint.txt
          fi
          exit "$code"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
