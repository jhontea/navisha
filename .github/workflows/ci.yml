name: CI

# Runs on every pull request, and is called by deploy.yml before images
# are built, so the checks live in one place.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its previous CI run. Runs called from
  # deploy.yml (push to main) are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_R2_PUBLIC_URL: https://assets.navisha.cloud

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Lint gates PRs only: only-new-issues needs a PR diff, and code on
      # main has already passed this step in its PR.
      - name: Lint (new issues only)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # Build golangci-lint with the project's Go toolchain; the prebuilt
          # binary targets an older Go than go.mod and exits with code 3.
          install-mode: goinstall
          working-directory: backend
          only-new-issues: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
